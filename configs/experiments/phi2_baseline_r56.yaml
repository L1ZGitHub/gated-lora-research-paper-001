# Baseline #2 — plain LoRA, EXPERT-capacity-matched vs the gated model.
#
# Matches only the LoRA expert parameters (Σranks = 8+16+32 = 56), i.e. the
# gated model gets its gating networks (+23.6M params) "for free". Reviewers
# usually want BOTH baselines: r=72 (total-matched, harsher) and r=56
# (adaptation-capacity-matched, isolates the routing contribution).
#
#   gated experts: 56 × 46080 × 32 = 82,575,360
#   plain LoRA r=56:                 82,575,360  (exact match)
# Verify with: python scripts/analysis/param_match.py --model microsoft/phi-2
extends:
  - models/phi2.yaml
  - tasks/all_8.yaml

experiment_name: phi2_baseline_r56
description: |
  Plain (non-gated) LoRA baseline on Phi-2, 8-task mix, matching the summed
  expert ranks of the gated model (r = 8+16+32 = 56).

model:
  model_type: baseline
  lora_r: 56
  lora_alpha: 112

training:
  num_epochs: 4

data:
  max_samples_per_task: 5000  # identical cap to the gated runs (legacy scale)

output:
  output_dir: ./outputs/phi2_baseline_r56
  hf_dataset_repo: Helain/gated-lora-experiments
  hf_dataset_path: phi2_baseline_r56
