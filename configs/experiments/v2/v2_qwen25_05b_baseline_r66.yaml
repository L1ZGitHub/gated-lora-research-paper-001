# Plain LoRA, TOTAL-param matched to the v2 gated model (experts + per-layer gates, no layer
# embedding): gated 36,323,400 vs r=66 36,292,608 (-0.08%). Analytic count, Qwen2.5-0.5B:
# H=896 I=4864 L=24 kv_dim=128 -> 22,912 params per rank unit per layer; gate 230,403 per layer.
extends:
  - models/qwen25_05b.yaml
  - tasks/all_8.yaml
  - base/v2.yaml

experiment_name: v2_qwen25_05b_baseline_r66

model:
  model_type: baseline
  lora_r: 66
  lora_alpha: 132

output:
  output_dir: ./outputs/v2_qwen25_05b_baseline_r66
  hf_dataset_repo: Helain/gated-lora-experiments
  hf_dataset_path: v2/qwen25_05b_baseline_r66
