# Control: FROZEN RANDOM gates (never trained), rescaled at init to a realistic sharpness.
# Experts train under a fixed random routing. If quality, knockout faithfulness and maps match
# the trained gate, learned routing buys nothing. frozen_gate_target_top1: placeholder from the
# legacy trained gates (mean top-1 0.44-0.50); SET IT from the Phase A v2 gated runs
# (final routing mean_top1_dominance) before launching Phase B. Regularisers off: no gate grads.
extends:
  - models/qwen25_05b.yaml
  - tasks/all_8.yaml
  - base/v2.yaml

experiment_name: v2_qwen25_05b_frozen_gate

model:
  freeze_gating: true
  frozen_gate_target_top1: 0.47
  use_load_balancing: false
  use_l1_gate_regularization: false

output:
  output_dir: ./outputs/v2_qwen25_05b_frozen_gate
  hf_dataset_repo: Helain/gated-lora-experiments
  hf_dataset_path: v2/qwen25_05b_frozen_gate
