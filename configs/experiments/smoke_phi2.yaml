# Smoke test — Phi-2 with the harder_multitask mixture but capped at 5 steps.
# Purpose: verify the stage-in/stage-out pipeline (git clone → uv sync → HF push)
# end-to-end without burning 4h of compute. Should finish in ~10-15 min.
extends:
  - models/phi2.yaml
  - tasks/all_8.yaml

experiment_name: smoke_phi2

training:
  num_epochs: 1
  max_steps: 5
  save_steps: 2          # save at steps 2, 4 → push to HF
  eval_steps: 9999       # never inside the 5-step smoke (full eval = 7k samples × bs1 ≈ 2h)
  warmup_ratio: 0.0
  logging_steps: 1
  # Tiny batch — the smoke runs on any partition (rtx6000 24 GB or a40 46 GB)
  # and validates the pipeline, not throughput.
  batch_size: 1
  gradient_accumulation_steps: 1
  max_length: 256
  early_stopping_patience: 9999  # don't try to early-stop in a 5-step run

data:
  # Smoke is about pipeline plumbing — 2 samples per task × 8 tasks = 16 batches.
  # Trainer has no max_steps support (only num_epochs), so we cap via samples.
  max_samples_per_task: 2

output:
  output_dir: ./outputs/smoke_phi2
  hf_dataset_repo: Helain/gated-lora-experiments
  hf_dataset_path: smoke_phi2
