# Phase C' LR grid point (small ranks). Gated mixed-rank LoRA, experts r=2/4/8 (total rank 14),
# same gate network as the 8/16/32 model.
extends:
  - models/qwen25_05b.yaml
  - tasks/all_8.yaml
  - base/v3.yaml

experiment_name: v3_qwen25_05b_gated_r2r4r8_lr2p5em5

model:
  expert_ranks: [2, 4, 8]
  expert_alphas: [4, 8, 16]
training:
  learning_rate: 2.5e-5

output:
  output_dir: ./outputs/v3_qwen25_05b_gated_r2r4r8_lr2p5em5
  hf_dataset_repo: Helain/gated-lora-experiments
  hf_dataset_path: v3/qwen25_05b_gated_r2r4r8_lr2p5em5
