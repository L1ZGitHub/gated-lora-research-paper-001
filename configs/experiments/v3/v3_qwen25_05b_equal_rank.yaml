# Control: three EQUAL-rank experts (19/19/18, same total rank 56, same params). If maps and
# quality match the mixed-rank model, rank diversity is not what the gate exploits. LR = gated's
# Phase A' LR (2.5e-5).
extends:
  - models/qwen25_05b.yaml
  - tasks/all_8.yaml
  - base/v3.yaml

experiment_name: v3_qwen25_05b_equal_rank

model:
  expert_ranks: [19, 19, 18]
  expert_alphas: [38, 38, 36]

training:
  learning_rate: 2.5e-5

output:
  output_dir: ./outputs/v3_qwen25_05b_equal_rank
  hf_dataset_repo: Helain/gated-lora-experiments
  hf_dataset_path: v3/qwen25_05b_equal_rank
