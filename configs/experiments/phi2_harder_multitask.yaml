# Replicates ensicompute_harder_multitask: Phi-2 gated × 8 tasks.
extends:
  - models/phi2.yaml
  - tasks/all_8.yaml

experiment_name: phi2_harder_multitask
description: |
  Phi-2 with gated LoRA trained on the 8-task harder mix
  (squad, imdb, conll2003, wikitext, gsm8k, xsum, commonsenseqa, mnli).
  Reproduces results from ensicompute_harder_multitask folder.

# Per-experiment overrides (optional)
training:
  num_epochs: 4

## data.max_samples_per_task is set once in tasks/all_8.yaml (5000/task,
## legacy scale) so gated, baselines and ablations all share the same cap.

# Output paths
output:
  output_dir: ./outputs/phi2_harder_multitask
  hf_dataset_repo: Helain/gated-lora-experiments
  hf_dataset_path: phi2_harder_multitask  # subdirectory within HF dataset
