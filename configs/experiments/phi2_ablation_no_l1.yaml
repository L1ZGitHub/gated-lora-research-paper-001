# Phi-2 × 8 tasks WITHOUT L1 regularization on gates.
extends:
  - models/phi2.yaml
  - tasks/all_8.yaml
  - ablations/no_l1.yaml

experiment_name: phi2_ablation_no_l1
description: |
  Phi-2 ablation: disable L1 regularization on gate weights to test
  whether sparsity-inducing penalty is necessary.

output:
  output_dir: ./outputs/phi2_ablation_no_l1
  hf_dataset_repo: Helain/gated-lora-experiments
  hf_dataset_path: phi2_ablation_no_l1
