# Ablation: gate only a subset of layers (early + late).
# Phi-2 has 32 layers. Gate only the "edges" (input/output adapters).
# Phi-2 ONLY: indices up to 31 are out of range for Qwen/Pythia (24), Gemma-2 (26), Llama-3.2 (28).
# v2 uses model.gated_layers_frac instead (e.g. experiments/v2/v2_qwen25_05b_gated_last_quarter.yaml).
ablation:
  name: partial_gating
  description: "Gating restricted to first-quarter and last-quarter layers"
overrides:
  model:
    # First 8 layers + last 8 layers (out of 32 for Phi-2)
    gated_layers: [0, 1, 2, 3, 4, 5, 6, 7, 24, 25, 26, 27, 28, 29, 30, 31]
